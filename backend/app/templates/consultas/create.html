{% extends "base.html" %}
{% block title %}SECE — Nueva consulta{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-7">
    <h4 class="mb-3">Registrar consulta</h4>
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    {% if cita %}
    <div class="card mb-3 border-primary">
      <div class="card-body">
        <p class="mb-0"><strong>Cita:</strong> {{ cita.fecha_hora.strftime('%d/%m/%Y %H:%M') }}</p>
      </div>
    </div>
    {% endif %}

    <form method="post" action="/consultas/crear">
      <input type="hidden" name="cita_id" value="{{ cita_id }}">
      <div class="mb-3">
        <label class="form-label">Diagnóstico *</label>
        <textarea name="diagnostico" class="form-control" rows="2" required></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Notas clínicas</label>
        <textarea name="notas_clinicas" class="form-control" rows="3"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Plan de tratamiento</label>
        <textarea name="plan_tratamiento" class="form-control" rows="3"></textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">Registrar consulta</button>
        <a href="/citas" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
