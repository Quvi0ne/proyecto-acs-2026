{% extends "base.html" %}
{% block title %}SECE — Registrar paciente{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-7">
    <h4 class="mb-3">Registrar nuevo paciente</h4>
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post" action="/pacientes/crear">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Nombre completo *</label>
          <input type="text" name="nombre_completo" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">DPI (13 dígitos) *</label>
          <input type="text" name="dpi" class="form-control" minlength="13" maxlength="13" pattern="\d{13}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Fecha de nacimiento *</label>
          <input type="date" name="fecha_nacimiento" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Sexo *</label>
          <select name="sexo" class="form-select" required>
            <option value="">Seleccionar...</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
          </select>
        </div>
        <div class="col-md-8">
          <label class="form-label">Teléfono</label>
          <input type="tel" name="telefono" class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label">Correo electrónico</label>
          <input type="email" name="email" class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label">Dirección</label>
          <textarea name="direccion" class="form-control" rows="2"></textarea>
        </div>
        <div class="col-12 d-flex gap-2">
          <button type="submit" class="btn btn-success">Registrar paciente</button>
          <a href="/pacientes" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
